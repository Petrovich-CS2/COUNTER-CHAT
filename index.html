  z-index:40;
  background:rgba(9,11,14,.72);
  backdrop-filter:blur(14px);
  -webkit-backdrop-filter:blur(14px);
}
.brand-row{display:flex; align-items:center; gap:11px;}
.brand-row > div:nth-child(2){flex:1; min-width:0;}
.voice-settings-btn{
  flex-shrink:0;
  width:36px; height:36px;
  border-radius:10px;
  background:var(--bg-surface);
  border:1px solid var(--line);
  display:flex; align-items:center; justify-content:center;
  cursor:pointer;
}
.voice-settings-btn:active{background:var(--bg-elevated);}
.brand-mark{
  width:38px; height:38px;
  border-radius:11px;
  flex-shrink:0;
  overflow:hidden;
}
.brand-mark img{display:block; width:100%; height:100%; object-fit:cover;}
.brand-title{
  font-family:var(--font-mono);
  font-weight:700;
  font-size:17px;
  letter-spacing:.06em;
  line-height:1.15;
}
.brand-sub{
  font-size:11.5px;
  color:var(--text-muted);
  margin-top:2px;
}

/* ===== screens ===== */
.screen{
  flex:1;
  padding:14px 16px 18px;
}

/* search */
.search-and-fav-row{
  display:flex;
  align-items:center;
  gap:9px;
  margin-bottom:14px;
}
.search-row{
  display:flex; align-items:center; gap:9px;
  background:var(--bg-surface);
  border:1px solid var(--line);
  border-radius:13px;
  padding:10px 13px;
  flex:1;
  min-width:0;
}
.search-row svg{flex-shrink:0; opacity:.5;}
.favorites-btn{
  position:relative;
  flex-shrink:0;
  width:44px; height:44px;
  border-radius:13px;
  background:var(--bg-surface);
  border:1px solid var(--line);
  display:flex; align-items:center; justify-content:center;
  cursor:pointer;
}
.favorites-btn:active{background:var(--bg-elevated);}
.favorites-btn.active{background:rgba(214,144,58,.18); border-color:rgba(214,144,58,.4);}
.header-icon-img{width:34px; height:34px; object-fit:contain;}
.favorites-btn-badge{
  position:absolute;
  top:-5px; right:-5px;
  min-width:17px; height:17px;
  padding:0 4px;
  border-radius:9px;
  background:var(--t-orange);
  color:#1a1006;
  font-family:var(--font-mono);
  font-size:10px;
  font-weight:700;
  display:flex; align-items:center; justify-content:center;
}
.favorites-btn-badge[hidden]{display:none;}

.history-strip{margin-bottom:14px;}
.history-strip[hidden]{display:none;}
.history-strip-label{
  display:flex; align-items:center; gap:5px;
  font-size:11px;
  color:var(--text-faint);
  margin-bottom:7px;
  font-weight:600;
  text-transform:uppercase;
  letter-spacing:.03em;
}
.history-chips{
  display:flex; gap:8px; overflow-x:auto;
  scrollbar-width:none;
  padding-bottom:2px;
}
.history-chips::-webkit-scrollbar{display:none;}
.history-chip{
  flex-shrink:0;
  display:flex; align-items:center; gap:6px;
  background:var(--bg-surface);
  border:1px solid var(--line);
  border-radius:10px;
  padding:8px 12px;
  font-family:var(--font-mono);
  font-size:12.5px;
  font-weight:600;
  color:#f2c98a;
  cursor:pointer;
  white-space:nowrap;
}
.history-chip:active{background:var(--bg-elevated);}

/* компактный режим */
body.compact-mode .phrase-ru{display:none;}
body.compact-mode .phrase-translit{margin-top:2px;}
body.compact-mode .phrase{padding-top:8px; padding-bottom:8px;}
.search-row input{
  background:none; border:none; outline:none;
  color:var(--text-primary);
  font-family:var(--font-body);
  font-size:14.5px;
  width:100%;
}
.search-row input::placeholder{color:var(--text-faint);}

/* category cards — квадратная сетка с иконками */
.categories-grid{
  display:grid;
  grid-template-columns:repeat(3, 1fr);
  gap:10px;
  margin-bottom:16px;
}
.category-card{
  aspect-ratio:1/1;
  border:1px solid var(--line);
  border-radius:16px;
  background:var(--bg-surface);
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:6px;
  padding:8px 6px;
  text-align:center;
  cursor:pointer;
  transition:background .15s ease, border-color .15s ease, transform .1s ease;
}
.category-card:active{transform:scale(.96);}
.category-card.active{
  border-color:var(--t-orange);
  background:var(--bg-elevated);
  box-shadow:0 0 0 1px var(--t-orange) inset, 0 4px 14px -6px rgba(214,144,58,.35);
}
.category-card-icon{
  width:52px; height:52px;
  display:flex; align-items:center; justify-content:center;
  font-size:26px;
  flex-shrink:0;
}
.category-card-icon img{width:100%; height:100%; object-fit:contain;}
.category-card-title{
  font-size:11.5px;
  font-weight:700;
  line-height:1.25;
}

/* раскрытая панель фраз выбранной категории */
.category-panel{
  border:1px solid var(--line);
  border-radius:15px;
  background:var(--bg-surface);
  margin-bottom:10px;
  overflow:hidden;
}
.category-panel-head{
  display:flex; align-items:center; gap:10px;
  padding:13px 15px;
  border-bottom:1px solid var(--line);
}
.category-panel-icon{
  width:26px; height:26px; border-radius:8px;
  background:rgba(214,144,58,.16);
  display:flex; align-items:center; justify-content:center;
  font-size:13px; flex-shrink:0;
  overflow:hidden;
}
.category-panel-icon img{width:100%; height:100%; object-fit:contain; padding:3px;}
.category-panel-head .category-title{flex:1;}
.empty-state{
  text-align:center;
  color:var(--text-faint);
  font-size:13px;
  padding:30px 10px;
}
.category-body-inner{padding:0 12px 12px;}

/* полноэкранная модалка категории — открывается поверх, как отдельный экран */
.category-modal{
  position:fixed;
  inset:0;
  max-width:480px;
  margin:0 auto;
  background:
    url("data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iMTYwIiBoZWlnaHQ9IjE2MCIgdmlld0JveD0iMCAwIDE2MCAxNjAiIHhtbG5zPSJodHRwOi8vd3d3LnczLm9yZy8yMDAwL3N2ZyI+CiAgPCEtLSDRgtC+0L3QutCw0Y8g0YLQsNC60YLQuNGH0LXRgdC60LDRjyBzZXTQutCwIC0tPgogIDxsaW5lIHgxPSIwIiB5MT0iMCIgeDI9IjE2MCIgeTI9IjAiIHN0cm9rZT0iI2ZmYjA2NiIgc3Ryb2tlLXdpZHRoPSIxIiBvcGFjaXR5PSIwLjA1Ii8+CiAgPGxpbmUgeDE9IjAiIHkxPSIwIiB4Mj0iMCIgeTI9IjE2MCIgc3Ryb2tlPSIjZmZiMDY2IiBzdHJva2Utd2lkdGg9IjEiIG9wYWNpdHk9IjAuMDUiLz4KICA8bGluZSB4MT0iMCIgeTE9IjgwIiB4Mj0iMTYwIiB5Mj0iODAiIHN0cm9rZT0iI2ZmYjA2NiIgc3Ryb2tlLXdpZHRoPSIxIiBvcGFjaXR5PSIwLjAzIi8+CiAgPGxpbmUgeDE9IjgwIiB5MT0iMCIgeDI9IjgwIiB5Mj0iMTYwIiBzdHJva2U9IiNmZmIwNjYiIHN0cm9rZS13aWR0aD0iMSIgb3BhY2l0eT0iMC4wMyIvPgoKICA8bGluZSB4MT0iMCIgeTE9IjE2MCIgeDI9IjE2MCIgeTI9IjAiIHN0cm9rZT0iI2ZmYjA2NiIgc3Ryb2tlLXdpZHRoPSIxIiBvcGFjaXR5PSIwLjAzNSIvPgoKICA8ZyBzdHJva2U9IiNmZmIwNjYiIHN0cm9rZS13aWR0aD0iMS42IiBvcGFjaXR5PSIwLjA5IiBmaWxsPSJub25lIiBzdHJva2UtbGluZWNhcD0icm91bmQiPgogICAgPHBhdGggZD0iTTQgMTQgTDQgNCBMMTQgNCIvPgogICAgPHBhdGggZD0iTTE0NiA0IEwxNTYgNCBMMTU2IDE0Ii8+CiAgICA8cGF0aCBkPSJNMTU2IDE0NiBMMTU2IDE1NiBMMTQ2IDE1NiIvPgogICAgPHBhdGggZD0iTTE0IDE1NiBMNCAxNTYgTDQgMTQ2Ii8+CiAgPC9nPgoKICA8ZyBzdHJva2U9IiNmZmIwNjYiIHN0cm9rZS13aWR0aD0iMS41IiBvcGFjaXR5PSIwLjEwIiBmaWxsPSJub25lIiBzdHJva2UtbGluZWNhcD0icm91bmQiPgogICAgPGNpcmNsZSBjeD0iODAiIGN5PSI4MCIgcj0iMTUiLz4KICAgIDxsaW5lIHgxPSI4MCIgeTE9IjU1IiB4Mj0iODAiIHkyPSI2MyIvPgogICAgPGxpbmUgeDE9IjgwIiB5MT0iOTciIHgyPSI4MCIgeTI9IjEwNSIvPgogICAgPGxpbmUgeDE9IjU1IiB5MT0iODAiIHgyPSI2MyIgeTI9IjgwIi8+CiAgICA8bGluZSB4MT0iOTciIHkxPSI4MCIgeDI9IjEwNSIgeTI9IjgwIi8+CiAgPC9nPgogIDxjaXJjbGUgY3g9IjgwIiBjeT0iODAiIHI9IjEuNiIgZmlsbD0iI2ZmYjA2NiIgb3BhY2l0eT0iMC4xMiIvPgo8L3N2Zz4=") repeat,
    radial-gradient(ellipse 640px 460px at 50% -80px, rgba(255,140,45,.22), transparent 68%),
    linear-gradient(180deg, #241206 0%, #180d06 28%, #100905 55%, #0a0704 78%, #05070a 100%);
  background-size: 160px 160px, auto, auto;
  z-index:200;
  display:flex;
  flex-direction:column;
  transform:translateX(100%);
  transition:transform .28s cubic-bezier(.32,.72,.35,1);
}
.category-modal.open{transform:translateX(0);}
.category-modal-head{
  display:flex; align-items:center; gap:10px;
  padding:calc(16px + env(safe-area-inset-top, 0px)) 16px 14px;
  border-bottom:1px solid var(--line);
  flex-shrink:0;
  background:rgba(9,11,14,.72);
  backdrop-filter:blur(14px);
  -webkit-backdrop-filter:blur(14px);
}
.modal-back-btn{
  width:34px; height:34px;
  border-radius:10px;
  background:var(--bg-surface);
  border:1px solid var(--line);
  display:flex; align-items:center; justify-content:center;
  cursor:pointer;
  flex-shrink:0;
}
.modal-back-btn:active{background:var(--bg-elevated);}
.category-modal-icon{
  width:30px; height:30px; border-radius:10px;
  background:#5A442A;
  display:flex; align-items:center; justify-content:center;
  font-size:15px; flex-shrink:0;
  overflow:hidden;
}
.category-modal-icon img{width:100%; height:100%; object-fit:contain; padding:3px;}
.category-modal-title{
  flex:1;
  font-size:15.5px;
  font-weight:700;
}
.category-modal-body{
  flex:1;
  overflow-y:auto;
  padding:14px 16px 30px;
  -webkit-overflow-scrolling:touch;
}
.category-modal-body::-webkit-scrollbar{display:none;}
.category-modal-body .phrase:first-child{margin-top:0;}

.voice-tip{
  font-size:12px;
  line-height:1.5;
  color:var(--text-muted);
  background:var(--bg-surface);
  border:1px solid var(--line);
  border-radius:12px;
  padding:12px 13px;
  margin-bottom:14px;
}
.voice-tip b{color:var(--text-primary); font-weight:700;}
.voice-list{display:flex; flex-direction:column; gap:8px;}
.voice-option{
  display:flex; align-items:center; gap:10px;
  background:var(--bg-elevated);
  border:1px solid var(--line);
  border-radius:12px;
  padding:11px 12px;
  cursor:pointer;
}
.voice-option.selected{border-color:var(--t-orange); background:var(--bg-elevated-2); box-shadow:0 0 0 1px var(--t-orange) inset;}
.voice-option-radio{
  width:18px; height:18px; border-radius:50%;
  border:2px solid var(--line-strong);
  flex-shrink:0;
  display:flex; align-items:center; justify-content:center;
}
.voice-option.selected .voice-option-radio{border-color:var(--t-orange);}
.voice-option.selected .voice-option-radio::after{content:""; width:9px; height:9px; border-radius:50%; background:var(--t-orange);}
.voice-option-text{flex:1; min-width:0;}
.voice-option-name{font-size:13.5px; font-weight:600;}
.voice-option-lang{font-family:var(--font-mono); font-size:10.5px; color:var(--text-faint); margin-top:2px;}
.voice-option-play{
  flex-shrink:0;
  width:34px; height:34px;
  border-radius:10px;
  background:rgba(214,144,58,.12);
  border:1px solid rgba(214,144,58,.28);
  display:flex; align-items:center; justify-content:center;
}
.voice-option-play:active{background:rgba(214,144,58,.25);}
.voice-empty{
  text-align:center; color:var(--text-faint); font-size:13px; padding:20px 10px;
}

.app-credits{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:7px;
  margin-top:14px;
  padding:6px;
  color:var(--text-faint);
  font-size:11.5px;
  text-decoration:none;
  opacity:.6;
  transition:opacity .15s ease, color .15s ease;
}
.app-credits:active{opacity:1; color:var(--t-orange);}
.app-credits svg{flex-shrink:0;}

.category-title{font-size:14.5px; font-weight:700;}
.category-count{
  font-family:var(--font-mono);
  font-size:11px; color:var(--text-faint);
}
.compact-toggle-btn{
  flex-shrink:0;
  width:34px; height:34px;
  border-radius:10px;
  background:var(--bg-surface);
  border:1px solid var(--line);
  display:flex; align-items:center; justify-content:center;
  cursor:pointer;
  margin-left:4px;
  transition:transform .1s ease, background .15s ease;
}
.compact-toggle-btn:active{transform:scale(.92);}
.compact-toggle-btn.active{background:rgba(214,144,58,.18); border-color:rgba(214,144,58,.4);}
.compact-toggle-img{width:24px; height:24px; object-fit:contain;}

.phrase{
  background:#181c22;
  border:1px solid var(--line);
  border-left:2.5px solid rgba(214,144,58,.35);
  border-radius:11px;
  padding:9px 9px 9px 12px;
  margin-top:8px;
  display:flex;
  align-items:center;
  gap:10px;
  position:relative;
}
.phrase:nth-child(even){
  background:#1c212a;
}
.phrase-text{
  flex:1;
  min-width:0;
  cursor:pointer;
  padding:2px 0;
  transition:transform .12s ease, opacity .12s ease;
}
.phrase-text:active{opacity:.7; transform:scale(.97);}
.phrase-en-row{
  display:flex;
  align-items:center;
  gap:6px;
}
.phrase-copy-hint{
  flex-shrink:0;
  opacity:.4;
}
.phrase-en{
  font-family:var(--font-mono);
  font-weight:600;
  font-size:14px;
  color:#f2c98a;
}
.phrase-translit{
  font-family:var(--font-mono);
  font-size:11px;
  color:rgba(242,201,138,.62);
  margin-top:3px;
  font-style:italic;
}
.phrase-ru{
  font-size:13px;
  color:var(--text-muted);
  margin-top:5px;
  line-height:1.4;
}
.phrase-actions{display:flex; align-items:center; gap:8px; flex-shrink:0;}
.play-btn-side{
  flex-shrink:0;
  width:42px; height:42px;
  border-radius:12px;
  background:rgba(214,144,58,.12);
  border:1px solid rgba(214,144,58,.28);
  display:flex; align-items:center; justify-content:center;
  cursor:pointer;
  transition:background .15s ease, transform .1s ease;
}
.play-btn-side:active{transform:scale(.92); background:rgba(214,144,58,.25);}
.play-btn-side.playing{background:rgba(214,144,58,.4); animation:pulse 1s ease-in-out infinite;}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(214,144,58,.4);} 50%{box-shadow:0 0 0 5px rgba(214,144,58,0);}}
.fav-btn-side{
  flex-shrink:0;
  width:42px; height:42px;
  border-radius:12px;
  background:rgba(255,255,255,.03);
  border:1px solid var(--line);
  display:flex; align-items:center; justify-content:center;
  cursor:pointer;
  transition:background .15s ease, border-color .15s ease, transform .1s ease;
}
.fav-btn-side:active{transform:scale(.92);}
.fav-btn-side.active{background:rgba(214,144,58,.18); border-color:rgba(214,144,58,.4);}
.phrase{transition:opacity .2s ease, transform .12s ease;}
.category-card.favorites-card{
  border-color:rgba(214,144,58,.45);
  box-shadow:0 0 0 1px rgba(214,144,58,.25) inset;
}

/* maps screen */
.map-chip-row{
  display:flex; gap:8px; overflow-x:auto; padding-bottom:4px; margin-bottom:14px;
  scrollbar-width:none;
}
.map-chip-row::-webkit-scrollbar{display:none;}
.map-chip{
  font-family:var(--font-mono);
  font-size:12px; font-weight:600;
  padding:8px 14px;
  border-radius:20px;
  background:var(--bg-surface);
  border:1px solid var(--line);
  color:var(--text-muted);
  white-space:nowrap;
  cursor:pointer;
  flex-shrink:0;
  transition:all .15s ease;
}
.map-chip.active{
  background:linear-gradient(140deg, var(--t-orange), #a9631d);
  color:#1a1006;
  border-color:transparent;
}

.schematic-card{
  border:1px solid var(--line);
  border-radius:16px;
  background:var(--bg-surface);
  padding:14px 14px 6px;
}
.schematic-head{
  display:flex; justify-content:space-between; align-items:baseline; margin-bottom:10px;
}
.map-name{font-family:var(--font-mono); font-weight:700; font-size:15px; letter-spacing:.03em;}
.schematic-hint{font-size:10px; color:var(--text-faint);}

.legend{display:flex; gap:14px; margin-bottom:10px;}
.legend-item{display:flex; align-items:center; gap:5px; font-size:10.5px; color:var(--text-muted); font-family:var(--font-mono);}
.legend-dot{width:8px; height:8px; border-radius:50%;}

.schematic{
  position:relative;
  width:100%;
  aspect-ratio:1/1.15;
  border-radius:12px;
  background:
    repeating-linear-gradient(45deg, rgba(255,255,255,.018) 0px, rgba(255,255,255,.018) 1px, transparent 1px, transparent 7px),
    linear-gradient(160deg, #14181e, #0a0c10);
  border:1px solid var(--line-strong);
  overflow:hidden;
  margin-bottom:10px;
}
/* координатная сетка радара — процедурная, декоративная */
.grid-layer{position:absolute; inset:0; z-index:0; pointer-events:none;}
.grid-line{position:absolute; background:rgba(255,255,255,.045);}
.grid-line.v{top:0; bottom:0; width:1px;}
.grid-line.h{left:0; right:0; height:1px;}
.grid-tick{
  position:absolute;
  font-family:var(--font-mono);
  font-size:7px;
  color:rgba(255,255,255,.22);
  letter-spacing:.02em;
}
.grid-tick.col{top:2px; transform:translateX(-50%);}
.grid-tick.row{left:2px; transform:translateY(-50%);}
.compass{
  position:absolute; top:6px; left:6px; z-index:3;
  width:14px; height:14px;
  opacity:.5;
  pointer-events:none;
}
/* залы/комнаты под точками — объёмный "инженерный" план с текстурой пола */
.room-shape{
  position:absolute;
  transform:translate(-50%,-50%);
  background:
    repeating-linear-gradient(45deg, rgba(255,255,255,.028) 0px, rgba(255,255,255,.028) 1.4px, transparent 1.4px, transparent 6px),
    rgba(108,120,136,.13);
  border:1px solid rgba(255,255,255,.10);
  box-shadow:
    inset 1.5px 1.5px 0 rgba(255,255,255,.10),
    inset -2px -2px 5px rgba(0,0,0,.4),
    0 3px 7px -3px rgba(0,0,0,.55);
  pointer-events:none;
  z-index:1;
}
.room-shape.site-room{
  background:
    repeating-linear-gradient(45deg, rgba(255,255,255,.035) 0px, rgba(255,255,255,.035) 1.4px, transparent 1.4px, transparent 6px),
    rgba(120,132,150,.19);
  border:1px solid rgba(255,255,255,.16);
  box-shadow:
    inset 2px 2px 0 rgba(255,255,255,.13),
    inset -3px -3px 6px rgba(0,0,0,.45),
    0 4px 10px -3px rgba(0,0,0,.6);
}
.site-letter{
  position:absolute;
  transform:translate(-50%,-50%);
  font-family:var(--font-mono);
  font-weight:800;
  pointer-events:none;
  z-index:1;
  opacity:.16;
  line-height:1;
}
.zone-glow{
  position:absolute;
  border-radius:50%;
  filter:blur(22px);
  opacity:.20;
  pointer-events:none;
  z-index:1;
  transform:translate(-50%,-50%);
}
.zone-outline{
  position:absolute;
  border-radius:16px;
  pointer-events:none;
  z-index:1;
  transform:translate(-50%,-50%);
  border:1.5px solid;
  opacity:.5;
}
.route-svg{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  z-index:2;
  pointer-events:none;
}
.route-line-bg{
  fill:none;
  stroke:#05070a;
  stroke-width:5.2;
  stroke-linecap:round;
  opacity:.6;
  vector-effect:non-scaling-stroke;
}
.route-line-floor{
  fill:none;
  stroke:#232a33;
  stroke-width:4.2;
  stroke-linecap:round;
  opacity:.7;
  vector-effect:non-scaling-stroke;
}
.route-line-highlight{
  fill:none;
  stroke:rgba(255,255,255,.14);
  stroke-width:.7;
  stroke-linecap:round;
  vector-effect:non-scaling-stroke;
  pointer-events:none;
}
.route-line{
  fill:none;
  stroke-width:1.3;
  stroke-linecap:round;
  opacity:.8;
  vector-effect:non-scaling-stroke;
  stroke-dasharray:0;
}
.pin{
  position:absolute;
  transform:translate(-50%,-50%);
  display:flex; flex-direction:column; align-items:center;
  cursor:pointer;
  z-index:5;
}
.pin-dot{
  width:11px; height:11px;
  border-radius:50%;
  border:2px solid var(--bg-page);
  box-shadow:0 0 0 1px var(--line-strong), 0 2px 6px rgba(0,0,0,.5);
  transition:transform .15s ease;
}
.pin:active .pin-dot{transform:scale(1.3);}
.pin-label{
  font-family:var(--font-mono);
  font-size:8.6px;
  font-weight:600;
  color:var(--text-primary);
  background:rgba(5,7,10,.72);
  padding:2px 5px;
  border-radius:5px;
  margin-top:3px;
  white-space:nowrap;
  border:1px solid var(--line);
  pointer-events:none;
}
.pin.selected .pin-dot{transform:scale(1.4); box-shadow:0 0 0 3px rgba(234,231,224,.25);}

.info-panel{
  border:1px solid var(--line-strong);
  border-radius:14px;
  background:var(--bg-elevated);
  padding:13px 14px 14px;
  margin-bottom:8px;
  animation:slideUp .2s ease;
}
@keyframes slideUp{from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);}}
.info-panel-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:6px;}
.info-panel-name{font-family:var(--font-mono); font-weight:700; font-size:15px;}
.info-panel-tag{
  font-family:var(--font-mono); font-size:9.5px; font-weight:700;
  padding:2px 7px; border-radius:6px; letter-spacing:.04em;
}
.info-panel-desc{font-size:13px; color:var(--text-muted); line-height:1.5;}
.info-close{opacity:.5; cursor:pointer;}

/* tab bar */
.tabbar{
  position:sticky;
  bottom:0;
  margin-top:auto;
  display:flex;
  border-top:1px solid var(--line);
  background:rgba(10,12,15,.92);
  backdrop-filter:blur(10px);
  padding:9px 10px 12px;
  z-index:100;
  flex-shrink:0;
}
.tab-btn{
  flex:1;
  display:flex; flex-direction:column; align-items:center; gap:3px;
  background:none; border:none;
  color:var(--text-faint);
  font-family:var(--font-body);
  font-size:10.5px;
  font-weight:600;
  padding:4px 0;
  cursor:pointer;
}
.tab-btn svg{stroke:var(--text-faint); transition:stroke .15s ease;}
.tab-btn.active{color:var(--t-orange);}
.tab-btn.active svg{stroke:var(--t-orange);}

/* toast */
.toast{
  position:fixed;
  bottom:40px; left:50%;
  transform:translateX(-50%) translateY(20px);
  background:#eae7e0;
  color:#12151a;
  font-family:var(--font-mono);
  font-size:12.5px;
  font-weight:600;
  padding:10px 16px;
  border-radius:11px;
  opacity:0;
  pointer-events:none;
  transition:all .25s ease;
  z-index:999;
  max-width:280px;
  text-align:center;
  box-shadow:0 10px 30px -8px rgba(0,0,0,.5);
}
.toast.show{opacity:1; transform:translateX(-50%) translateY(0);}
</style>
</head>

function categoryIconMarkup(catId){
  if (CATEGORY_ICONS[catId]) return `<img src="${CATEGORY_ICONS[catId]}" alt="">`;
  if (CATEGORY_EMOJI_FALLBACK[catId]) return CATEGORY_EMOJI_FALLBACK[catId];
  return '💬';
}

/* ================= ИЗБРАННОЕ ================= */
const FAVORITES_KEY = 'cc_favorites';
function favKey(catId, en){ return catId + '::' + en; }
function getFavoriteKeys(){
  try {
    const raw = localStorage.getItem(FAVORITES_KEY);
    return raw ? new Set(JSON.parse(raw)) : new Set();
  } catch(e){ return new Set(); }
}
function saveFavoriteKeys(set){
  try { localStorage.setItem(FAVORITES_KEY, JSON.stringify([...set])); } catch(e){}
}
function isFavorite(catId, en){ return getFavoriteKeys().has(favKey(catId, en)); }
function toggleFavorite(catId, en){
  const set = getFavoriteKeys();
  const key = favKey(catId, en);
  if (set.has(key)) set.delete(key); else set.add(key);
  saveFavoriteKeys(set);
}
function getFavoritePhrases(){
  const set = getFavoriteKeys();
  const result = [];
  categories.forEach(cat => {
    cat.phrases.forEach(p => {
      if (set.has(favKey(cat.id, p.en))){
        result.push(Object.assign({}, p, { _catId: cat.id }));
      }
    });
  });
  return result;
}

/* ================= ИСТОРИЯ / НЕДАВНИЕ ================= */
const HISTORY_KEY = 'cc_history';
const HISTORY_MAX = 10;
const historyStrip = document.getElementById('historyStrip');
function getHistory(){
  try {
    const raw = localStorage.getItem(HISTORY_KEY);
    return raw ? JSON.parse(raw) : [];
  } catch(e){ return []; }
}
function addToHistory(catId, p){
  let list = getHistory();
  list = list.filter(item => !(item.catId === catId && item.en === p.en));
  list.unshift({ catId, en: p.en, translit: p.translit, ru: p.ru, speak: p.speak });
  if (list.length > HISTORY_MAX) list = list.slice(0, HISTORY_MAX);
  try { localStorage.setItem(HISTORY_KEY, JSON.stringify(list)); } catch(e){}
  renderHistoryStrip();
}
function renderHistoryStrip(){
  const list = getHistory();
  if (!list.length){
    historyStrip.hidden = true;
    historyStrip.innerHTML = '';
    return;
  }
  historyStrip.hidden = false;
  historyStrip.innerHTML = `
    <div class="history-strip-label">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><polyline points="12 7 12 12 16 14"/></svg>
      Недавние
    </div>
    <div class="history-chips"></div>
  `;
  const chipsWrap = historyStrip.querySelector('.history-chips');
  list.forEach(item => {
    const chip = document.createElement('div');
    chip.className = 'history-chip';
    chip.textContent = item.en;
    chip.addEventListener('click', () => {
      copyToClipboard(item.en);
      addToHistory(item.catId, item);
    });
    chipsWrap.appendChild(chip);
  });
}
renderHistoryStrip();

document.getElementById('compactModeIcon').src = COMPACT_ICON_IMG;
function isCompactMode(){ return localStorage.getItem(COMPACT_MODE_KEY) === '1'; }
function applyCompactMode(){
  const on = isCompactMode();
  document.body.classList.toggle('compact-mode', on);
  document.getElementById('compactModeBtn').classList.toggle('active', on);
}
document.getElementById('compactModeBtn').addEventListener('click', () => {
  localStorage.setItem(COMPACT_MODE_KEY, isCompactMode() ? '0' : '1');
  applyCompactMode();
});
applyCompactMode();


function openCategoryModal(cat, phrases){
  modalIcon.innerHTML = cat.id === 'favorites'
    ? `<img src="${STAR_ICON_IMG}" alt="" style="width:100%;height:100%;object-fit:contain;">`
    : categoryIconMarkup(cat.id);
  modalTitle.textContent = cat.title;
  modalCount.textContent = phrases.length;
  categoryModalBody.innerHTML = '';
  if (cat.id === 'favorites' && !phrases.length){
    categoryModalBody.innerHTML = `<div class="empty-state">Пока нет избранных фраз.<br>Нажми ★ на любой фразе, чтобы добавить сюда.</div>`;
  }
  phrases.forEach(p => {
    const catId = cat.id === 'favorites' ? p._catId : cat.id;
    categoryModalBody.appendChild(buildPhraseEl(p, catId, { isFavoritesView: cat.id === 'favorites' }));
  });
  categoryModal.style.transition = 'none';
  categoryModal.style.transform = 'translateX(100%)';
  categoryModal.hidden = false;
  categoryModal.offsetHeight; // форсируем reflow, чтобы стартовая позиция точно применилась
  requestAnimationFrame(() => {
    categoryModal.style.transition = '';
    categoryModal.style.transform = '';
    categoryModal.classList.add('open');
  });
}
function closeCategoryModal(){
  categoryModal.classList.remove('open');
  categoryModal.style.transition = 'transform .28s cubic-bezier(.32,.72,.35,1)';
  categoryModal.style.transform = 'translateX(100%)';
  let done = false;
  const finish = () => {
    if (done) return;
    done = true;
    categoryModal.hidden = true;
    categoryModal.style.transition = '';
    categoryModal.style.transform = '';
  };
  categoryModal.addEventListener('transitionend', finish, { once: true });
  setTimeout(finish, 320); // подстраховка, если transitionend не сработает
}
document.getElementById('modalBackBtn').addEventListener('click', closeCategoryModal);

/* жест «назад» — свайп вправо от левого края экрана, как в iOS */
function attachSwipeBack(modalEl, closeFn){
  let startX = 0, currentX = 0, dragging = false, startTime = 0;
  const EDGE_ZONE = 40;   // зона у левого края, с которой начинается жест
  const THRESHOLD = 90;   // на сколько px нужно провести палец, чтобы закрыть

  modalEl.addEventListener('touchstart', e => {
    if (e.touches.length !== 1) return;
    startX = e.touches[0].clientX;
    currentX = startX;
    dragging = startX <= EDGE_ZONE;
    startTime = Date.now();
    if (dragging) modalEl.style.transition = 'none';
  }, { passive: true });

  modalEl.addEventListener('touchmove', e => {
    if (!dragging) return;
    currentX = e.touches[0].clientX;
    const dx = Math.max(0, currentX - startX);
    modalEl.style.transform = `translateX(${dx}px)`;
  }, { passive: true });

  function endDrag(){
    if (!dragging) return;
    dragging = false;
    modalEl.style.transition = '';
    const dx = Math.max(0, currentX - startX);
    const dt = Date.now() - startTime;
    const velocity = dx / Math.max(dt, 1);
    if (dx > THRESHOLD || velocity > 0.55){
      closeFn();
    } else {
      modalEl.style.transform = '';
    }
  }
  modalEl.addEventListener('touchend', endDrag);
  modalEl.addEventListener('touchcancel', endDrag);
}

const VOICE_STORAGE_KEY = 'cc_voice_uri';
let cachedVoices = [];
function loadVoices(){

  updateVoiceRowLabel();
}

  loadVoices();

function englishVoices(){
  return cachedVoices.filter(v => /^en/i.test(v.lang));
}

/* эвристика качества — на iOS «Enhanced/Premium» голоса звучат заметно естественнее, чем «Compact» */
function voiceQualityScore(v){
  const n = v.name.toLowerCase();
  let s = 0;
  if (n.includes('samantha')) s += 10; // явное предпочтение на iOS — стабильнее всего на коротких/нестандартных фразах и сленге
  if (n.includes('google') && n.includes('us')) s += 10; // явное предпочтение на Android — движок Google TTS (WaveNet), звучит естественнее стандартных голосов производителей
  if (n.includes('premium')) s += 6;
  if (n.includes('enhanced')) s += 5;
  if (n.includes('neural')) s += 5;
  if (n.includes('natural')) s += 4;
  if (n.includes('google')) s += 3;
  if (n.includes('siri')) s += 3;
  if (['ava','nicky','allison','susan','zoe','tom','alex','daniel','moira','tessa','karen','stephanie'].some(x=>n.includes(x))) s += 2;
  if (n.includes('compact')) s -= 3;
  if (/^en-us$/i.test(v.lang)) s += 1;
  return s;
}
function bestDefaultVoice(){
  const list = englishVoices();
  if (!list.length) return null;
  return list.slice().sort((a,b) => voiceQualityScore(b) - voiceQualityScore(a))[0];
}
function getSelectedVoice(){
  const uri = localStorage.getItem(VOICE_STORAGE_KEY);
  if (uri){
    const v = cachedVoices.find(v => v.voiceURI === uri);
    if (v) return v;
  }
  return bestDefaultVoice();
}
function setSelectedVoice(voice){
  if (voice) localStorage.setItem(VOICE_STORAGE_KEY, voice.voiceURI);
  updateVoiceRowLabel();
}
function cleanVoiceName(v){
  return v.name.replace(/\s*\(.*?\)\s*/g, '').trim() || v.name;
}
function updateVoiceRowLabel(){
  // зарезервировано на случай текстового индикатора выбранного голоса в шапке
}

function speak(text, btnEl){
  if (!('speechSynthesis' in window)){
    showToast('Озвучка не поддерживается в этом браузере');
    return;
  }
  window.speechSynthesis.cancel();
  const utter = new SpeechSynthesisUtterance(text);
  utter.lang = 'en-US';
  utter.rate = 0.94;
  utter.pitch = 1;
  const voice = getSelectedVoice();
  if (voice) utter.voice = voice;
  document.querySelectorAll('.play-btn-side.playing').forEach(b => b.classList.remove('playing'));
  if (btnEl) btnEl.classList.add('playing');
  utter.onend = () => { if (btnEl) btnEl.classList.remove('playing'); };
  utter.onerror = () => { if (btnEl) btnEl.classList.remove('playing'); };
  window.speechSynthesis.speak(utter);
}

/* определяем платформу для показа правильной инструкции по качественным голосам */
function detectPlatform(){
  const ua = navigator.userAgent || '';
  const isIOS = /iPad|iPhone|iPod/.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  if (isIOS) return 'ios';

}

  } else if (platform === 'android'){

      <b>Настройки → Система → Языки и ввод → Синтез речи (Text-to-speech) → Google → значок настроек ⚙️ → Установить голосовые данные</b> → скачайте английский (US) голос. Для лучшего качества также выберите движок <b>Google</b> как предпочтительный, а не Samsung/другой.`;

/* ================= RENDER: MAPS ================= */
const mapChips = document.getElementById('mapChips');
const schematic = document.getElementById('schematic');
const mapNameEl = document.getElementById('mapName');
const infoPanel = document.getElementById('infoPanel');
let currentMap = "Dust II";

function renderChips(){
  mapChips.innerHTML = "";
  Object.keys(maps).forEach(name => {
    const chip = document.createElement('div');
    chip.className = 'map-chip' + (name === currentMap ? ' active' : '');
    chip.textContent = name;
    chip.addEventListener('click', () => { currentMap = name; renderChips(); renderSchematic(); });
    mapChips.appendChild(chip);
  });
}

function zoneBounds(mapName, zone){
  const pts = maps[mapName].points.filter(p => p.z === zone);
  if (!pts.length) return null;
  const xs = pts.map(p=>p.x), ys = pts.map(p=>p.y);
  const cx = (Math.min(...xs)+Math.max(...xs))/2;
  const cy = (Math.min(...ys)+Math.max(...ys))/2;
  const w = Math.max(Math.max(...xs)-Math.min(...xs), 14) + 16;
  const h = Math.max(Math.max(...ys)-Math.min(...ys), 12) + 16;
  return {cx, cy, w, h};
}

/* координатная сетка в стиле игрового радара — буквы сверху, цифры слева.
   Полностью процедурная, не привязана к реальным картам — авторский декоративный слой. */
function renderGrid(container){
  const layer = document.createElement('div');
  layer.className = 'grid-layer';
  const cols = 10, rows = 11;
  const letters = "ABCDEFGHIJKLMNOP";
  for (let i=1;i<cols;i++){
    const line = document.createElement('div');
    line.className = 'grid-line v';
    line.style.left = (i*100/cols)+'%';
    layer.appendChild(line);
  }
  for (let i=1;i<rows;i++){
    const line = document.createElement('div');
    line.className = 'grid-line h';
    line.style.top = (i*100/rows)+'%';
    layer.appendChild(line);
  }
  for (let i=0;i<cols;i++){
    const t = document.createElement('div');
    t.className = 'grid-tick col';
    t.style.left = ((i+0.5)*100/cols)+'%';
    t.textContent = letters[i];
    layer.appendChild(t);
  }
  for (let i=0;i<rows;i++){
    const t = document.createElement('div');
    t.className = 'grid-tick row';
    t.style.top = ((i+0.5)*100/rows)+'%';
    t.textContent = (i+1);
    layer.appendChild(t);
  }
  container.appendChild(layer);

  const compass = document.createElementNS("http://www.w3.org/2000/svg","svg");
  compass.setAttribute("viewBox","0 0 20 20");
  compass.classList.add("compass");
  compass.innerHTML = `<polygon points="10,1 18,18 10,14 2,18" fill="#eae7e0"/>`;
  container.appendChild(compass);
}

/* простая детерминированная псевдослучайность (без Math.random) — стабильные размеры "залов" между рендерами */
function seeded(str){
  let h = 0;
  for (let i=0;i<str.length;i++){ h = (h*31 + str.charCodeAt(i)) >>> 0; }
  return (h % 1000) / 1000;
}

function renderSchematic(){
  mapNameEl.textContent = currentMap;
  infoPanel.hidden = true;
  const data = maps[currentMap];
  schematic.innerHTML = "";

  renderGrid(schematic);

  /* зоны сайтов — подсветка + контур + крупная полупрозрачная буква сайта, привязанные к реальным координатам точек */
  ["a","b"].forEach(zone => {
    const b = zoneBounds(currentMap, zone);
    if (!b) return;
    const color = zoneColor[zone];
    const glow = document.createElement('div');
    glow.className = 'zone-glow';
    glow.style.cssText = `left:${b.cx}%; top:${b.cy}%; width:${b.w}%; height:${b.h}%; background:${color};`;
    schematic.appendChild(glow);
    const outline = document.createElement('div');
    outline.className = 'zone-outline';
    outline.style.cssText = `left:${b.cx}%; top:${b.cy}%; width:${b.w*0.82}%; height:${b.h*0.82}%; border-color:${color};`;
    schematic.appendChild(outline);
    const letter = document.createElement('div');
    letter.className = 'site-letter';
    letter.style.cssText = `left:${b.cx}%; top:${b.cy}%; font-size:${Math.min(b.w,b.h)*1.6}px; color:${color};`;
    letter.textContent = zone.toUpperCase();
    schematic.appendChild(letter);
  });

  /* "залы" — авторские декоративные формы пола под точками, не копия реальной геометрии карты.
     Точки на сайтах A/B получают заметно более крупные "залы" — как настоящие бомб-сайты. */
  data.points.forEach(pt => {
    const s = seeded(currentMap+pt.n);
    const isSite = pt.z === 'a' || pt.z === 'b';
    const w = isSite ? (16 + s*6) : (8 + s*7);
    const h = isSite ? (13 + (1-s)*6) : (6 + (1-s)*6);
    const room = document.createElement('div');
    room.className = 'room-shape' + (isSite ? ' site-room' : '');
    room.style.cssText = `left:${pt.x}%; top:${pt.y}%; width:${w}%; height:${h}%; border-radius:${isSite ? 4+s*4 : 3+s*5}px;`;
    schematic.appendChild(room);
  });

  /* линии маршрутов — многослойная отрисовка (тёмная тень + пол коридора + смещённая подсветка края + цветная осевая линия) */
  const svgNS = "http://www.w3.org/2000/svg";
  const svg = document.createElementNS(svgNS, "svg");
  svg.setAttribute("viewBox","0 0 100 100");
  svg.setAttribute("preserveAspectRatio","none");
  svg.classList.add("route-svg");
  data.edges.forEach(([fromName, toName]) => {
    const a = getPoint(currentMap, fromName);
    const b = getPoint(currentMap, toName);
    if (!a || !b) return;
    const zone = (a.z !== 'n') ? a.z : b.z;
    const color = zone==='a' ? "#e0a84a" : zone==='b' ? "#48b6c2" : "#7b828c";

    // перпендикулярное смещение для полоски подсветки (имитация освещённой стены коридора)
    const dx = b.x - a.x, dy = b.y - a.y;
    const len = Math.hypot(dx, dy) || 1;
    const nx = -dy/len, ny = dx/len;
    const off = 1.1;

    const bg = document.createElementNS(svgNS, "line");
    bg.setAttribute("x1", a.x); bg.setAttribute("y1", a.y);
    bg.setAttribute("x2", b.x); bg.setAttribute("y2", b.y);
    bg.classList.add("route-line-bg");
    svg.appendChild(bg);

    const floor = document.createElementNS(svgNS, "line");
    floor.setAttribute("x1", a.x); floor.setAttribute("y1", a.y);
    floor.setAttribute("x2", b.x); floor.setAttribute("y2", b.y);
    floor.classList.add("route-line-floor");
    svg.appendChild(floor);

    const hl = document.createElementNS(svgNS, "line");
    hl.setAttribute("x1", a.x - nx*off); hl.setAttribute("y1", a.y - ny*off);
    hl.setAttribute("x2", b.x - nx*off); hl.setAttribute("y2", b.y - ny*off);
    hl.classList.add("route-line-highlight");
    svg.appendChild(hl);

    const line = document.createElementNS(svgNS, "line");
    line.setAttribute("x1", a.x); line.setAttribute("y1", a.y);
    line.setAttribute("x2", b.x); line.setAttribute("y2", b.y);
    line.setAttribute("stroke", color);
    line.classList.add("route-line");
    svg.appendChild(line);
  });
  schematic.appendChild(svg);

  /* пины */
  data.points.forEach(pt => {
    const pin = document.createElement('div');
    pin.className = 'pin';
    pin.style.left = pt.x + '%';
    pin.style.top = pt.y + '%';
    pin.innerHTML = `<div class="pin-dot" style="background:${zoneColor[pt.z]}"></div><div class="pin-label">${pt.n}</div>`;
    pin.addEventListener('click', () => selectPin(pin, pt));
    schematic.appendChild(pin);
  });
}

function selectPin(pinEl, pt){
  document.querySelectorAll('.pin.selected').forEach(p => p.classList.remove('selected'));
  pinEl.classList.add('selected');
  const tagLabel = pt.z === 'a' ? 'САЙТ A' : pt.z === 'b' ? 'САЙТ B' : 'ЗОНА';
  const tagColor = zoneColor[pt.z];
  infoPanel.hidden = false;
  infoPanel.innerHTML = `
    <div class="info-panel-head">
      <div style="display:flex; align-items:center; gap:7px;">
        <button class="icon-btn play-btn" data-speak="${pt.n.replace(/"/g,'&quot;')}" aria-label="Озвучить">
          <svg width="11" height="11" viewBox="0 0 24 24" fill="#f2c98a"><polygon points="5,3 20,12 5,21"/></svg>
        </button>
        <span class="info-panel-name">${pt.n}</span>
      </div>
      <span class="info-panel-tag" style="background:${tagColor}22; color:${tagColor}; border:1px solid ${tagColor}55;">${tagLabel}</span>
    </div>
    <div class="info-panel-desc">${pt.d}</div>
  `;
  infoPanel.querySelector('.play-btn').addEventListener('click', (e) => {
    e.stopPropagation();
    speak(pt.n, e.currentTarget);
  });
}

renderChips();
renderSchematic();

/* ================= TABS ================= */
const screens = { phrases: document.getElementById('screen-phrases'), maps: document.getElementById('screen-maps') };
document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    const tab = btn.getAttribute('data-tab');
    Object.entries(screens).forEach(([key, el]) => { el.hidden = key !== tab; });
  });
});
</script>
</body>
</html>
