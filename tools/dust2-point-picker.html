<head>
<meta charset="UTF-8">

<title>Расстановка точек — Dust II (52)</title>
<style>
  :root{ --bg:#0a0c10; --panel:#14181e; --line:#262b33; --text:#eae7e0; --muted:#8b9199; --accent:#d6903a; }
  *{box-sizing:border-box;}
  body{ margin:0; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; background:var(--bg); color:var(--text); display:flex; flex-direction:column; min-height:100vh; }
  header{ padding:14px 16px; border-bottom:1px solid var(--line); background:var(--panel); }
  h1{font-size:16px; margin:0;}
  .sub{font-size:12px; color:var(--muted); margin-top:2px;}
  #mapWrap{
    position:relative; width:100%; max-width:600px; margin:16px auto;
    height:70vh; max-height:640px;
    border:1px solid var(--line); border-radius:10px;
    overflow:auto; -webkit-overflow-scrolling:touch; cursor:crosshair;
  }
  #mapInner{ position:relative; width:100%; touch-action:pan-x pan-y; }
  #mapImg{width:100%; display:block; user-select:none; -webkit-user-drag:none; pointer-events:none;}
  #zoomControls{
    max-width:600px; margin:0 auto 10px; display:flex; align-items:center; gap:6px;
    justify-content:center; flex-wrap:wrap; padding:0 16px;
  }
  #zoomControls button{
    width:38px; height:38px; padding:0; font-size:18px; font-weight:700;
    background:var(--panel); color:var(--text); border:1px solid var(--line);
    border-radius:8px; cursor:pointer;
  }
  #zoomPct{font-size:13px; color:var(--muted); min-width:48px; text-align:center;}
  .marker{ position:absolute; width:15px; height:15px; margin:-7.5px 0 0 -7.5px; border-radius:50%; background:#d6903a; border:2px solid #fff; box-shadow:0 0 0 2px rgba(0,0,0,.5); cursor:grab; z-index:2; touch-action:none; }
  .marker.prefilled{background:#4ade80;}
  .marker-label{ position:absolute; top:13px; left:50%; transform:translateX(-50%); background:rgba(10,12,16,.92); color:#fff; font-size:10px; font-weight:700; padding:2px 5px; border-radius:5px; white-space:nowrap; pointer-events:none; border:1px solid rgba(255,255,255,.15); }
  #controls{ max-width:600px; margin:0 auto; padding:0 16px 24px; width:100%; }
  .row{display:flex; gap:8px; margin-bottom:10px; flex-wrap:wrap; align-items:center;}
  select, button{ font-size:14px; padding:9px 12px; border-radius:8px; border:1px solid var(--line); background:var(--panel); color:var(--text); }
  select{flex:1; min-width:160px;}
  button{background:var(--accent); color:#1a1206; font-weight:700; border:none; cursor:pointer;}
  button.secondary{background:var(--panel); color:var(--text); border:1px solid var(--line);}
  button:disabled{opacity:.4; cursor:not-allowed;}
  #status{font-size:13px; color:var(--muted); margin-bottom:10px; min-height:18px;}
  #progressBar{height:6px; background:#262b33; border-radius:3px; overflow:hidden; margin-bottom:14px;}
  #progressFill{height:100%; background:var(--accent); width:0%; transition:width .2s;}
  #list{font-size:11.5px; color:var(--muted); margin-bottom:14px; line-height:1.7; columns:2; column-gap:16px;}
  #list b{color:var(--text);}
  #output{ width:100%; min-height:260px; font-family:monospace; font-size:12px; background:#000; color:#8f8; padding:12px; border-radius:8px; border:1px solid var(--line); white-space:pre; overflow:auto; }
  .hint{font-size:12px; color:var(--muted); margin:10px 0;}
  .legend{font-size:11px; color:var(--muted); margin-bottom:10px;}
  .legend span{display:inline-flex; align-items:center; gap:4px; margin-right:14px;}
  .dot{width:10px; height:10px; border-radius:50%; display:inline-block;}
</style>
</head>

  { n:"Дефолт", x:null, y:null },
  { n:"Рампа", x:90, y:11 },
  { n:"Бочки", x:null, y:null },
  { n:"Гусь", x:79, y:6 },
  { n:"Дабл", x:null, y:null },
  { n:"Испанский", x:null, y:null },
  { n:"Спавн CT", x:null, y:null }
];

const STORAGE_KEY = 'dust2_point_placement_v3';
let placed = {};

POINTS.forEach(p => { if (p.x !== null) placed[p.n] = { x: p.x, y: p.y, prefilled: true }; });

try {
  const saved = localStorage.getItem(STORAGE_KEY);
  if (saved) placed = JSON.parse(saved);
} catch(e){}

const mapWrap = document.getElementById('mapWrap');
const mapInner = document.getElementById('mapInner');
const mapImg = document.getElementById('mapImg');
const zoomPct = document.getElementById('zoomPct');
let zoomLevel = 100;

function applyZoom(newZoom, focusClientX, focusClientY){
  newZoom = Math.max(100, Math.min(400, newZoom));
  // сохраняем точку под пальцем/курсором на месте при увеличении
  const rect = mapWrap.getBoundingClientRect();
  const beforeX = mapWrap.scrollLeft + (focusClientX - rect.left);
  const beforeY = mapWrap.scrollTop + (focusClientY - rect.top);
  const ratio = newZoom / zoomLevel;
  zoomLevel = newZoom;
  mapInner.style.width = zoomLevel + '%';
  zoomPct.textContent = zoomLevel + '%';
  mapWrap.scrollLeft = beforeX * ratio - (focusClientX - rect.left);
  mapWrap.scrollTop = beforeY * ratio - (focusClientY - rect.top);
}

document.getElementById('zoomInBtn').addEventListener('click', () => {
  const r = mapWrap.getBoundingClientRect();
  applyZoom(zoomLevel + 50, r.left + r.width/2, r.top + r.height/2);
});
document.getElementById('zoomOutBtn').addEventListener('click', () => {
  const r = mapWrap.getBoundingClientRect();
  applyZoom(zoomLevel - 50, r.left + r.width/2, r.top + r.height/2);
});
document.getElementById('zoomResetBtn').addEventListener('click', () => {
  zoomLevel = 100; mapInner.style.width = '100%'; zoomPct.textContent = '100%';
  mapWrap.scrollLeft = 0; mapWrap.scrollTop = 0;
});

const PAN_STEP = 120;
document.getElementById('panUpBtn').addEventListener('click', () => mapWrap.scrollBy({ top: -PAN_STEP, behavior:'smooth' }));
document.getElementById('panDownBtn').addEventListener('click', () => mapWrap.scrollBy({ top: PAN_STEP, behavior:'smooth' }));
document.getElementById('panLeftBtn').addEventListener('click', () => mapWrap.scrollBy({ left: -PAN_STEP, behavior:'smooth' }));
document.getElementById('panRightBtn').addEventListener('click', () => mapWrap.scrollBy({ left: PAN_STEP, behavior:'smooth' }));

// зум колесом мыши с зажатым Ctrl/Cmd, и просто прокрутка иначе
mapWrap.addEventListener('wheel', (e) => {
  if (!e.ctrlKey && !e.metaKey) return;
  e.preventDefault();
  applyZoom(zoomLevel + (e.deltaY < 0 ? 30 : -30), e.clientX, e.clientY);
}, { passive:false });

// пинч-зум двумя пальцами на тачскрине
let pinchStartDist = null;
let pinchStartZoom = 100;
mapWrap.addEventListener('touchstart', (e) => {
  if (e.touches.length === 2){
    pinchStartDist = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
    pinchStartZoom = zoomLevel;
  }
}, { passive:true });
mapWrap.addEventListener('touchmove', (e) => {
  if (e.touches.length === 2 && pinchStartDist){
    e.preventDefault();
    const dist = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
    const midX = (e.touches[0].clientX + e.touches[1].clientX) / 2;
    const midY = (e.touches[0].clientY + e.touches[1].clientY) / 2;
    applyZoom(pinchStartZoom * (dist / pinchStartDist), midX, midY);
  }
}, { passive:false });
mapWrap.addEventListener('touchend', (e) => { if (e.touches.length < 2) pinchStartDist = null; });
const pointSelect = document.getElementById('pointSelect');
const statusEl = document.getElementById('status');
const listEl = document.getElementById('list');
const outputEl = document.getElementById('output');
const progressFill = document.getElementById('progressFill');

function save(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(placed)); }
function currentName(){ return pointSelect.value; }
function nextUnplacedName(){ return POINTS.map(p=>p.n).find(n => !placed[n]); }

function refreshSelect(){
  const prevValue = pointSelect.value;
  pointSelect.innerHTML = '';
  POINTS.forEach(p => {
    const opt = document.createElement('option');
    opt.value = p.n;
    opt.textContent = (placed[p.n] ? '✅ ' : '⬜ ') + p.n;
    pointSelect.appendChild(opt);
  });
  if (prevValue && POINTS.some(p=>p.n===prevValue)) pointSelect.value = prevValue;
  else { const next = nextUnplacedName(); if (next) pointSelect.value = next; }
}

function refreshMarkers(){
  document.querySelectorAll('.marker, .marker-label').forEach(el => el.remove());
  Object.entries(placed).forEach(([name, pos]) => {
    const marker = document.createElement('div');
    marker.className = 'marker' + (pos.prefilled ? ' prefilled' : '');
    marker.style.left = pos.x + '%';
    marker.style.top = pos.y + '%';
    const label = document.createElement('div');
    label.className = 'marker-label';
    label.textContent = name;
    marker.appendChild(label);
    mapInner.appendChild(marker);
    makeDraggable(marker, name);
  });
}

function refreshList(){
  const name = currentName();
  const doneCount = Object.keys(placed).length;
  statusEl.textContent = `Расставлено: ${doneCount} из ${POINTS.length}. Сейчас: "${name}" — кликни на карту.`;
  progressFill.style.width = (doneCount / POINTS.length * 100) + '%';
  listEl.innerHTML = POINTS.map(p => {
    const pos = placed[p.n];
    return pos ? `<b>✅ ${p.n}</b>: ${pos.x},${pos.y}` : `⬜ ${p.n}: —`;
  }).join('<br>');
}

function refreshAll(){ refreshSelect(); refreshMarkers(); refreshList(); }

let history = []; // { name, prevValue } — prevValue может быть null, если точки раньше не было
const undoBtn = document.getElementById('undoBtn');

function recordHistory(name){
  history.push({ name, prevValue: placed[name] ? { ...placed[name] } : null });
  if (history.length > 50) history.shift(); // не даём расти бесконечно
  undoBtn.disabled = false;
}

undoBtn.addEventListener('click', () => {
  const last = history.pop();
  if (!last) return;
  if (last.prevValue) placed[last.name] = last.prevValue;
  else delete placed[last.name];
  save();
  refreshAll();
  undoBtn.disabled = history.length === 0;
});

mapInner.addEventListener('click', (e) => {
  if (e.target.closest('.marker')) return;
  const rect = mapImg.getBoundingClientRect();
  const x = (e.clientX - rect.left) / rect.width * 100;
  const y = (e.clientY - rect.top) / rect.height * 100;
  const name = currentName();
  if (!name) return;
  recordHistory(name);
  placed[name] = { x: Math.round(x*10)/10, y: Math.round(y*10)/10, prefilled: false };
  save();
  refreshAll();
});

function makeDraggable(marker, name){
  let dragging = false;
  let historyRecorded = false;
  marker.addEventListener('pointerdown', (e) => { e.stopPropagation(); dragging = true; historyRecorded = false; marker.setPointerCapture(e.pointerId); });
  marker.addEventListener('pointermove', (e) => {
    if (dragging && !historyRecorded){ recordHistory(name); historyRecorded = true; }
    if (!dragging) return;
    const rect = mapImg.getBoundingClientRect();
    const x = Math.max(0, Math.min(100, (e.clientX - rect.left) / rect.width * 100));
    const y = Math.max(0, Math.min(100, (e.clientY - rect.top) / rect.height * 100));
    placed[name] = { x: Math.round(x*10)/10, y: Math.round(y*10)/10, prefilled: false };
    marker.style.left = x + '%'; marker.style.top = y + '%';
    marker.classList.remove('prefilled');
  });
  marker.addEventListener('pointerup', () => { if (!dragging) return; dragging = false; save(); refreshList(); });
}

pointSelect.addEventListener('change', refreshList);
document.getElementById('skipBtn').addEventListener('click', () => {
  const names = POINTS.map(p=>p.n);
  const idx = names.indexOf(currentName());
  pointSelect.value = names[(idx+1) % names.length];
  refreshList();
});
document.getElementById('resetBtn').addEventListener('click', () => {
  if (!confirm('Стереть вообще всё, включая уже подставленные точки?')) return;
  placed = {}; save(); refreshAll();
});
function buildReadableOutput(){
  return POINTS.map(p => {
    const pos = placed[p.n];
    return pos ? `${p.n}: x=${pos.x}, y=${pos.y}` : `${p.n}: НЕ РАССТАВЛЕНА`;
  }).join('\n');
}

document.getElementById('exportBtn').addEventListener('click', () => {
  outputEl.value = buildReadableOutput();
  outputEl.style.display = 'block';
  outputEl.scrollIntoView({ behavior: 'smooth' });
});

const copyBtn = document.getElementById('copyBtn');
copyBtn.addEventListener('click', async () => {
  const text = buildReadableOutput();
  const originalLabel = copyBtn.textContent;
  try {
    await navigator.clipboard.writeText(text);
    copyBtn.textContent = '✅ Скопировано!';
  } catch(e){
    outputEl.value = text;
    outputEl.style.display = 'block';
    outputEl.select();
    try {
      document.execCommand('copy');
      copyBtn.textContent = '✅ Скопировано!';
    } catch(e2){
      copyBtn.textContent = '⚠️ Не удалось — скопируй вручную ниже';
      outputEl.scrollIntoView({ behavior: 'smooth' });
    }
  }
  setTimeout(() => { copyBtn.textContent = originalLabel; }, 2000);
});

refreshAll();
</script>
