name: Deploy Counter Chat to GitHub Pages

# запускается автоматически при каждой загрузке изменений в ветку main
on:
  push:
    branches: ["main"]
  workflow_dispatch: # позволяет запустить вручную кнопкой на вкладке Actions, если понадобится

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Забираем код репозитория
        uses: actions/checkout@v4
        with:
          fetch-depth: 2 # нужно для сравнения с предыдущим коммитом на следующем шаге

      - name: Если changelog.json не менялся в этом коммите — считаем правку косметической
        run: |
          if git rev-parse HEAD~1 >/dev/null 2>&1 && git diff --name-only HEAD~1 HEAD -- changelog.json | grep -q changelog.json; then
            echo "changelog.json был изменён автором в этом коммите — оставляем его текст как есть"
          else
            echo "changelog.json не менялся — ставим нейтральный текст с датой, чтобы разные обновления не выглядели одинаково"
            TODAY=$(date +"%-d %B" --date="today" | sed \
              -e "s/January/января/" -e "s/February/февраля/" -e "s/March/марта/" \
              -e "s/April/апреля/" -e "s/May/мая/" -e "s/June/июня/" \
              -e "s/July/июля/" -e "s/August/августа/" -e "s/September/сентября/" \
              -e "s/October/октября/" -e "s/November/ноября/" -e "s/December/декабря/")
            echo "{\"text\": \"Небольшие улучшения и исправления (обновлено $TODAY)\"}" > changelog.json
          fi

      - name: Подставляем версию сборки в sw.js и index.html
        run: |
          # версия = короткий номер коммита + время публикации — гарантированно
          # уникальна при каждой публикации, вручную ничего трогать не нужно
          BUILD_VERSION="${GITHUB_SHA::7}-$(date +%s)"
          echo "Версия сборки: $BUILD_VERSION"
          sed -i "s/__BUILD_VERSION__/${BUILD_VERSION}/g" sw.js
          sed -i "s/__BUILD_VERSION__/${BUILD_VERSION}/g" index.html

      - name: Настраиваем GitHub Pages
        uses: actions/configure-pages@v5

      - name: Загружаем готовые файлы
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Публикуем сайт
        id: deployment
        uses: actions/deploy-pages@v4
